<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Contract - Продукти</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 24px;
            max-width: 900px;
            margin-inline: auto;
        }
        h1 { color: #00d9ff; margin-bottom: 8px; }
        h2 { color: #aaa; font-size: 1.1rem; margin-top: 32px; margin-bottom: 12px; }
        p { margin: 8px 0; }
        input, button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 14px;
        }
        input {
            background: #16213e;
            color: #eee;
            width: 100%;
            margin-bottom: 10px;
        }
        input::placeholder { color: #666; }
        button {
            background: #0f3460;
            color: #00d9ff;
            border-color: #00d9ff;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1a4a7a; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; color: #aaa; font-size: 13px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #2a2a4a;
        }
        th { background: #0f3460; color: #00d9ff; font-weight: 600; }
        tr:hover { background: #1a2a4a; }
        .product-img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 6px;
            object-fit: cover;
        }
        .product-img.error { display: none; }
        .addr { font-family: monospace; font-size: 12px; color: #888; }
        .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Storage</h1>
    <p>User: <span id="name">?</span> <span id="age">?</span></p>
    <p>Wallet: <span id="wallet" class="addr">—</span></p>
    <p>Current value: <span id="value">?</span></p>
    <div class="btn-row">
        <input type="number" placeholder="Set value" id="number" style="width: auto; margin-bottom: 0;">
        <button onclick="set_value()">Set value</button>
        <button onclick="loadProducts()">Оновити</button>
    </div>

    <h2>Створити новий продукт</h2>
    <div class="form-group">
        <label>Назва продукту</label>
        <input type="text" id="productName" placeholder="Назва">
    </div>
    <div class="form-group">
        <label>Опис</label>
        <input type="text" id="productDesc" placeholder="Опис">
    </div>
    <div class="form-group">
        <label>Ціна (wei)</label>
        <input type="number" id="productPrice" placeholder="0" value="0">
    </div>
    <div class="form-group">
        <label>URL картинки</label>
        <input type="url" id="productImage" placeholder="https://">
    </div>
    <button onclick="createProduct()">Створити продукт</button>

    <h2>Продукти</h2>
    <button onclick="loadProducts()">Оновити</button>
    <table>
        <thead>
            <tr>
                <th>Назва</th>
                <th>Опис</th>
                <th>Адреса акаунта</th>
                <th>Дата створення</th>
                <th>Картинка</th>
            </tr>
        </thead>
        <tbody id="productsTable">
            <tr><td colspan="5" style="text-align: center; color: #666;">Завантаження...</td></tr>
        </tbody>
    </table>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <script src="./scripts/contract_abi.js"></script>
    <script>
        const contractAddress = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";

        const getContract = async (withSigner = false) => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            if (withSigner) {
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                return new ethers.Contract(contractAddress, abi, signer);
            }
            return new ethers.Contract(contractAddress, abi, provider);
        };

        const get_user = async () => {
            try {
                const contract = await getContract();
                const user = await contract.get_user();
                document.getElementById("name").textContent = user.name;
                document.getElementById("age").textContent = user.age;
            } catch (e) {
                document.getElementById("name").textContent = "—";
                document.getElementById("age").textContent = "—";
            }
        };

        const updateWallet = async () => {
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                document.getElementById("wallet").textContent = accounts[0] || "—";
            } catch {
                document.getElementById("wallet").textContent = "—";
            }
        };

        const get_value = async () => {
            try {
                const contract = await getContract();
                const value = await contract.get_value();
                document.getElementById("value").textContent = value.toString();
            } catch {
                document.getElementById("value").textContent = "—";
            }
        };

        const set_value = async () => {
            const val = document.getElementById("number").value;
            if (!val) return;
            const contract = await getContract(true);
            const tx = await contract.set_value(val);
            await tx.wait();
            get_value();
        };

        const createProduct = async () => {
            const name = document.getElementById("productName").value.trim();
            const desc = document.getElementById("productDesc").value.trim();
            const price = document.getElementById("productPrice").value || "0";
            const imageUrl = document.getElementById("productImage").value.trim() || "";

            if (!name) {
                alert("Введіть назву продукту");
                return;
            }

            const contract = await getContract(true);
            const tx = await contract.createProduct(name, desc, price, imageUrl);
            await tx.wait();

            document.getElementById("productName").value = "";
            document.getElementById("productDesc").value = "";
            document.getElementById("productPrice").value = "0";
            document.getElementById("productImage").value = "";
            loadProducts();
        };

        const formatDate = (timestamp) => {
            const d = new Date(Number(timestamp) * 1000);
            return d.toLocaleString("uk-UA");
        };

        const loadProducts = async () => {
            const tbody = document.getElementById("productsTable");
            try {
                const contract = await getContract();
                const count = await contract.getProductsCount();
                const n = Number(count);

                if (n === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">Немає продуктів</td></tr>';
                    return;
                }

                let html = "";
                for (let i = 0; i < n; i++) {
                    const p = await contract.getProduct(i);
                    const [name, description, price, creator, timestamp, imageUrl] = p;
                    const dateStr = formatDate(timestamp);
                    const imgHtml = imageUrl
                        ? `<img class="product-img" src="${imageUrl}" alt="" onerror="this.classList.add('error')">`
                        : "—";
                    html += `<tr>
                        <td>${escapeHtml(name)}</td>
                        <td>${escapeHtml(description)}</td>
                        <td class="addr">${creator}</td>
                        <td>${dateStr}</td>
                        <td>${imgHtml}</td>
                    </tr>`;
                }
                tbody.innerHTML = html;
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #c44;">Помилка завантаження</td></tr>';
            }
        };

        function escapeHtml(s) {
            const div = document.createElement("div");
            div.textContent = s;
            return div.innerHTML;
        }

        get_user();
        updateWallet();
        get_value();
        loadProducts();
    </script>
</body>
</html>
